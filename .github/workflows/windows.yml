name: windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest      # PyInstaller cannot cross-compile
    permissions:
      contents: write            # the release upload writes; the default is read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install textual pyinstaller
      - run: python -m unittest test_moxfield -v
      - run: pyinstaller --clean --noconfirm moxfield.spec
      - name: smoke test the exe
        run: |
          dist\moxfield.exe --help
          dist\moxfield.exe search --help
      # Two destinations on purpose. The artifact is for a manual run: it lives
      # on the run page, needs a login, and expires. The release asset is the
      # one people download, and only a tag has somewhere to put it.
      - uses: actions/upload-artifact@v4
        with:
          name: moxfield-windows
          path: dist/moxfield.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/moxfield.exe
